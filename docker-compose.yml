services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - ALPINEROUTE_HOST=0.0.0.0
      - ALPINEROUTE_DATA_DIR=/app/data

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
